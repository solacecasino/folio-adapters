# Live co-editing over encrypted peer-to-peer links. See docs/folio-link.md.
name = "Folio Link"
version = "0.3.1"
author = "Folio"
license = "MIT"
description = "Edit a document together, live, over an encrypted direct link. No accounts."
homepage = "https://github.com/solacecasino/folio-adapters/tree/main/folio-link"

# Built by ./build.sh.
run = ["./folio-link"]

permissions = ["document.read", "document.edit", "network"]

# Nothing runs, and nothing goes online, until you choose Share or Join.
start = "command"

events = ["snapshot"]

# Clicking a folio://join#... invite link joins with it.
links = { join = "join" }

[[commands]]
id = "share"
label = "Share This Document"

[[commands]]
id = "join"
label = "Join from Clipboard"   # or click the invite link

[[commands]]
id = "stop"
label = "Stop Sharing"

[[commands]]
id = "copy-invite"
label = "Copy Invite Again"

[[panels]]
id = "people"
title = "People"
