name: List my adapter
description: Add your adapter to the catalog (no pull request needed).
title: "List adapter: "
labels: ["catalog"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for making an adapter! Before you submit, make sure your repo is public and its
        **latest release** has your zips, named `<adapter>-<version>-<platform>.zip` (or
        `<adapter>-<version>.zip` for script adapters). The
        [template](https://github.com/solacecasino/folio-adapter-template) does this for you.
  - type: input
    id: repo
    attributes:
      label: GitHub repo
      placeholder: you/word-goals
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [Writing, Export, Collaboration, Look, Tools, Other]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: What it does, who it's for, what you'd like feedback on.
